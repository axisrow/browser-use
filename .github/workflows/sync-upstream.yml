name: 'Sync main with upstream'
on:
  schedule:
    - cron: '0 4 * * *' # Run daily at 4:00 AM UTC
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: github.repository != 'browser-use/browser-use'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Merge upstream/main
        id: merge
        run: |
          git remote add upstream https://github.com/browser-use/browser-use.git
          git fetch upstream main
          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push merged main
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin main

      - name: Open issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch upstream main
          git merge --no-commit --no-ff upstream/main || true
          FILES=$(git diff --name-only --diff-filter=U)
          git merge --abort || true
          BODY=$(printf 'The scheduled sync from upstream/main hit a merge conflict and was aborted — nothing was pushed.\n\nConflicting files:\n```\n%s\n```\n\nResolve manually:\n```bash\ngit fetch upstream\ngit merge upstream/main\n# resolve conflicts\ngit push origin main\n```' "$FILES")
          EXISTING=$(gh issue list --search "Upstream sync conflict in:title" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Upstream sync conflict" --body "$BODY"
          fi
